name: 로또 당첨번호 주간 갱신

on:
  schedule:
    # 매주 토요일 추첨(20:45 KST) 이후 22:00 KST = 13:00 UTC, 실패 대비 일요일 09:00 KST 재시도
    - cron: "0 13 * * 6"
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 최신 회차 수집
        run: node scripts/fetch-draws.mjs
      - name: 변경 사항 커밋
        run: |
          if git diff --quiet data/draws.json; then
            echo "새 회차 없음"
            exit 0
          fi
          ROUND=$(node -e "console.log(require('./data/draws.json').latestRound)")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/draws.json
          git commit -m "data: ${ROUND}회차 당첨번호 추가"
          git push
